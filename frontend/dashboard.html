<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - PMS</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- ==========================
             SIDEBAR
        =========================== -->

        <aside class="sidebar">

            <div class="sidebar-header">
                <h2>PMS</h2>
                <p>Project Management</p>
            </div>

            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-item active">
                    Dashboard
                </a>

                <a href="projects.html" class="nav-item">
                    Projects
                </a>

                <a href="tasks.html" class="nav-item">
                    Tasks
                </a>

                <a href="team.html" class="nav-item">
                    Team
                </a>

                <a href="#" class="nav-item">
                    Profile
                </a>

            </nav>

            <div class="sidebar-bottom">

                <button id="themeToggle" class="theme-btn">
                    Dark Mode
                </button>

                <button id="logoutBtn" class="logout-btn">
                    Logout
                </button>

            </div>

        </aside>


        <!-- ==========================
             MAIN CONTENT
        =========================== -->

        <main class="main-content">

            <!-- ==========================
                 HEADER
            =========================== -->

            <header class="top-header">

                <div>

                    <h1>
                        Dashboard
                    </h1>

                    <p id="welcomeMessage">
                        Welcome back
                    </p>

                </div>

            </header>


            <!-- ==========================
                 DASHBOARD CARDS
            =========================== -->

            <section class="dashboard-cards">

                <!-- PROJECTS -->

                <div class="dashboard-card">

                    <div class="card-content">

                        <h3>
                            Projects
                        </h3>

                        <p id="projectsCount">
                            0
                        </p>

                    </div>

                </div>


                <!-- TASKS -->

                <div class="dashboard-card">

                    <div class="card-content">

                        <h3>
                            Tasks
                        </h3>

                        <p id="tasksCount">
                            0
                        </p>

                    </div>

                </div>


                <!-- TEAM MEMBERS -->

                <div class="dashboard-card">

                    <div class="card-content">

                        <h3>
                            Team Members
                        </h3>

                        <p id="teamMembersCount">
                            0
                        </p>

                    </div>

                </div>


                <!-- COMPLETED TASKS -->

                <div class="dashboard-card">

                    <div class="card-content">

                        <h3>
                            Completed Tasks
                        </h3>

                        <p id="completedTasksCount">
                            0
                        </p>

                    </div>

                </div>

            </section>


            <!-- ==========================
                 QUICK ACTIONS
            =========================== -->

            <section class="dashboard-section">

                <div class="section-header">

                    <h2>
                        Quick Actions
                    </h2>

                </div>


                <div class="quick-actions">

                    <button
                        class="action-btn"
                        id="createProjectBtn"
                    >
                        Create Project
                    </button>


                    <button
                        class="action-btn"
                        id="createTaskBtn"
                    >
                        Create Task
                    </button>


                    <button
                        class="action-btn"
                        id="viewTeamBtn"
                    >
                        View Team
                    </button>

                </div>

            </section>


            <!-- ==========================
                 RECENT ACTIVITY
            =========================== -->

            <section class="dashboard-section">

                <div class="section-header">

                    <h2>
                        Recent Activity
                    </h2>

                </div>


                <div id="recentActivity">

                    <div class="empty-state">

                        <p>
                            Loading activity...
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script src="js/dashboard.js"></script>

</body>

</html>
